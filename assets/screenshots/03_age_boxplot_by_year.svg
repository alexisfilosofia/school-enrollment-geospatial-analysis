    <g transform="translate(780,0)"><line x1="0" y1="205" x2="0" y2="430"/><rect x="-38" y="268" width="76" height="120" rx="7" fill="#e5edf6" stroke="#174a7c"/><line x1="-38" y1="328" x2="38" y2="328"/><circle cx="0" cy="170" r="5" fill="#d6a94a" stroke="none"/><text x="0" y="565" font-size="15" fill="#2d3748" stroke="none">1914</text></g>
