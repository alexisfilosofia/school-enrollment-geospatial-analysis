<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" role="img" aria-label="Age dispersion and outlier detection by year">
  <rect width="1100" height="640" fill="#ffffff"/>
  <text x="70" y="70" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#172033">Age dispersion and outlier detection</text>
  <text x="70" y="105" font-family="Arial, sans-serif" font-size="17" fill="#5f6f82">Boxplot-style public rendering used to communicate distribution, dispersion and outlier review.</text>
  <line x1="105" y1="530" x2="1010" y2="530" stroke="#2b3442" stroke-width="2"/>
  <line x1="105" y1="150" x2="105" y2="530" stroke="#2b3442" stroke-width="2"/>
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="105" y1="470" x2="1010" y2="470"/><line x1="105" y1="410" x2="1010" y2="410"/><line x1="105" y1="350" x2="1010" y2="350"/><line x1="105" y1="290" x2="1010" y2="290"/><line x1="105" y1="230" x2="1010" y2="230"/><line x1="105" y1="170" x2="1010" y2="170"/>
  </g>
