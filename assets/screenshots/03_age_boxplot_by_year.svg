    <g transform="translate(480,0)"><line x1="0" y1="225" x2="0" y2="450"/><rect x="-38" y="285" width="76" height="112" rx="7" fill="#e5edf6" stroke="#174a7c"/><line x1="-38" y1="342" x2="38" y2="342"/><circle cx="0" cy="190" r="5" fill="#d6a94a" stroke="none"/><text x="0" y="565" font-size="15" fill="#2d3748" stroke="none">1912</text></g>
