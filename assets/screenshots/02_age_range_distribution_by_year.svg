    <rect x="705" y="100" width="16" height="16" fill="#8ab4df"/><text x="730" y="113">Older students</text>
    <rect x="705" y="128" width="16" height="16" fill="#d6a94a"/><text x="730" y="141">Outlier / late entries</text>
