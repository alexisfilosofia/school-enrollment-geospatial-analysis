<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" role="img" aria-label="Age range composition by registry year">
  <rect width="1100" height="640" fill="#ffffff"/>
  <text x="70" y="70" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#172033">Age-range composition by year</text>
  <text x="70" y="105" font-family="Arial, sans-serif" font-size="17" fill="#5f6f82">Public-safe stacked visualization of age composition across registry years.</text>
  <line x1="100" y1="530" x2="1010" y2="530" stroke="#2b3442" stroke-width="2"/>
  <line x1="100" y1="160" x2="100" y2="530" stroke="#2b3442" stroke-width="2"/>
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="100" y1="456" x2="1010" y2="456"/><line x1="100" y1="382" x2="1010" y2="382"/><line x1="100" y1="308" x2="1010" y2="308"/><line x1="100" y1="234" x2="1010" y2="234"/><line x1="100" y1="160" x2="1010" y2="160"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="14" fill="#718096">
    <text x="55" y="535">0%</text><text x="47" y="461">20%</text><text x="47" y="387">40%</text><text x="47" y="313">60%</text><text x="47" y="239">80%</text><text x="39" y="165">100%</text>
  </g>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g transform="translate(155,0)"><rect x="0" y="196" width="95" height="334" rx="8" fill="#174a7c"/><rect x="0" y="160" width="95" height="36" rx="8" fill="#8ab4df"/><rect x="0" y="118" width="95" height="42" rx="8" fill="#d6a94a"/><text x="47" y="565" font-size="15" fill="#2d3748">1910</text></g>
    <g transform="translate(305,0)"><rect x="0" y="204" width="95" height="326" rx="8" fill="#174a7c"/><rect x="0" y="164" width="95" height="40" rx="8" fill="#8ab4df"/><rect x="0" y="118" width="95" height="46" rx="8" fill="#d6a94a"/><text x="47" y="565" font-size="15" fill="#2d3748">1911</text></g>
    <g transform="translate(455,0)"><rect x="0" y="212" width="95" height="318" rx="8" fill="#174a7c"/><rect x="0" y="170" width="95" height="42" rx="8" fill="#8ab4df"/><rect x="0" y="118" width="95" height="52" rx="8" fill="#d6a94a"/><text x="47" y="565" font-size="15" fill="#2d3748">1912</text></g>
    <g transform="translate(605,0)"><rect x="0" y="219" width="95" height="311" rx="8" fill="#174a7c"/><rect x="0" y="175" width="95" height="44" rx="8" fill="#8ab4df"/><rect x="0" y="118" width="95" height="57" rx="8" fill="#d6a94a"/><text x="47" y="565" font-size="15" fill="#2d3748">1913</text></g>
    <g transform="translate(755,0)"><rect x="0" y="226" width="95" height="304" rx="8" fill="#174a7c"/><rect x="0" y="178" width="95" height="48" rx="8" fill="#8ab4df"/><rect x="0" y="118" width="95" height="60" rx="8" fill="#d6a94a"/><text x="47" y="565" font-size="15" fill="#2d3748">1914</text></g>
    <g transform="translate(905,0)"><rect x="0" y="232" width="95" height="298" rx="8" fill="#174a7c"/><rect x="0" y="182" width="95" height="50" rx="8" fill="#8ab4df"/><rect x="0" y="118" width="95" height="64" rx="8" fill="#d6a94a"/><text x="47" y="565" font-size="15" fill="#2d3748">1915</text></g>
