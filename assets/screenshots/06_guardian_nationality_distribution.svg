<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" role="img" aria-label="Aggregate guardian nationality distribution">
  <rect width="1100" height="640" fill="#ffffff"/>
  <text x="70" y="70" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#172033">Aggregate guardian nationality distribution</text>
  <text x="70" y="105" font-family="Arial, sans-serif" font-size="17" fill="#5f6f82">Public-safe frequency visualization for portfolio reporting.</text>
  <line x1="270" y1="530" x2="1010" y2="530" stroke="#2b3442" stroke-width="2"/>
  <line x1="270" y1="165" x2="270" y2="530" stroke="#2b3442" stroke-width="2"/>
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="270" y1="460" x2="1010" y2="460"/><line x1="270" y1="390" x2="1010" y2="390"/><line x1="270" y1="320" x2="1010" y2="320"/><line x1="270" y1="250" x2="1010" y2="250"/><line x1="270" y1="180" x2="1010" y2="180"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="16" fill="#2d3748">
    <text x="90" y="226">Most frequent category</text><rect x="270" y="200" width="650" height="34" rx="8" fill="#174a7c"/>
    <text x="90" y="296">Second category</text><rect x="270" y="270" width="300" height="34" rx="8" fill="#174a7c"/>
    <text x="90" y="366">Third category</text><rect x="270" y="340" width="245" height="34" rx="8" fill="#174a7c"/>
    <text x="90" y="436">Fourth category</text><rect x="270" y="410" width="150" height="34" rx="8" fill="#174a7c"/>
    <text x="90" y="506">Other / unspecified</text><rect x="270" y="480" width="210" height="34" rx="8" fill="#174a7c"/>
  </g>
  <text x="70" y="610" font-family="Arial, sans-serif" font-size="14" fill="#718096">Shown as an aggregate distribution only. It is not linked to addresses or individual student records.</text>
</svg>
